name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [hi3518ev200, hi3516cv200]

    steps:
      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g:i386 libc6:i386 libstdc++6:i386

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: arm-hisiv510-linux-v1

      - name: Download toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -R OpenIPC/toolchains \
            -p 'arm-hisiv510-linux.tgz'
          mkdir -p toolchain
          tar xzf arm-hisiv510-linux.tgz -C toolchain
          if [ -f toolchain/arm-hisiv510-linux/arm-hisiv510-linux.tar.bz2 ]; then
            tar xjf toolchain/arm-hisiv510-linux/arm-hisiv510-linux.tar.bz2 -C toolchain
          fi
          rm arm-hisiv510-linux.tgz
          # Create short-name symlinks (target/bin/ has absolute symlinks that won't work)
          cd toolchain/arm-hisiv510-linux/bin
          for f in arm-hisiv510-linux-uclibcgnueabi-*; do
            ln -sf "$f" "${f/-uclibcgnueabi/}"
          done

      - name: Build
        run: |
          export PATH="$PWD/toolchain/arm-hisiv510-linux/bin:$PATH"
          make ${{ matrix.board }}_config
          cp reg_info_${{ matrix.board }}.bin .reg
          make CROSS_COMPILE=arm-hisiv510-linux- -j$(nproc)
          make CROSS_COMPILE=arm-hisiv510-linux- mini-boot.bin
          cp mini-boot.bin u-boot-${{ matrix.board }}-universal.bin
          # The UART-recovery image: same sources, no DDR training, small
          # enough for the boot ROM to accept. Built second because it
          # cleans the compressed dir (the two variants share object names).
          make CROSS_COMPILE=arm-hisiv510-linux- mini-boot-recovery.bin
          cp mini-boot-recovery.bin u-boot-${{ matrix.board }}-recovery.bin

      - name: Check partition fit
        run: |
          # The boot partition in mtdparts (hi-common.h) is 256 KiB
          # across every NOR/NAND/UBI variant. Anything past that
          # overflows into env at offset 0x40000 and bricks the device
          # on upgrade. Mirrors OpenIPC/firmware Makefile CHECK_SIZE.
          LIMIT_KB=256
          for FILE in u-boot-${{ matrix.board }}-universal.bin \
                      u-boot-${{ matrix.board }}-recovery.bin; do
            SIZE_KB=$(($(stat -c %s "$FILE") / 1024))
            echo "- $FILE: [${SIZE_KB}KB/${LIMIT_KB}KB]"
            if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
              echo "-- size exceeded by: $((SIZE_KB - LIMIT_KB))KB"
              exit 1
            fi
          done

      - name: Check bootrom SRAM window fit
        run: |
          # The bootrom copies the SPL into SRAM at 0x04010500 and SRAM ends
          # at 0x04014000, so everything ahead of the compressed payload must
          # fit in 0x3B00 (15104) bytes. Overrun it and the chip cannot be
          # recovered over UART at all -- it stops answering mid-upload.
          # See OpenIPC/firmware#2299. The window is not a whole number of
          # 1 KB blocks and the payload must start on a 1 KB boundary, so the
          # number to reach is the window rounded down: 0x3800 (14336).
          #
          # Two images, two policies:
          #   recovery   is the one uploaded over UART. It MUST fit. Hard fail.
          #   universal  is the one flashed. It does not fit yet (#5), so it
          #              ratchets against its current size and warns.
          #
          # mini-boot.lds ASSERTs the same numbers at link time; this re-checks
          # the artifacts we actually ship, because the .bin files are
          # assembled from the ELFs by dd after linking.
          #
          # The boundary is found by locating the exact image_data.lzma this
          # build produced and requiring it to appear once. Scanning for a
          # compression header instead -- which is what recovery tools have to
          # do, having only the image -- can match a coincidental byte
          # sequence in the prelude and validate a boundary that is not the
          # payload's, i.e. pass while the real prelude is oversized.
          python3 - "u-boot-${{ matrix.board }}-universal.bin" \
                    "u-boot-${{ matrix.board }}-recovery.bin" \
                    $(find arch/arm/cpu -name image_data.lzma) <<'EOF'
          import sys
          WINDOW = 0x3B00     # what the bootrom can actually load into SRAM
          TARGET = WINDOW & ~0x3FF   # ...rounded down, because of the ALIGN
          RATCHET = 0x4400    # what the flashed image achieves; lower only
          universal, recovery, payloads = sys.argv[1], sys.argv[2], sys.argv[3:]
          if len(payloads) != 1:
              sys.exit("expected exactly one image_data.lzma under arch/arm/cpu,"
                       " found %d%s" % (len(payloads),
                                        ": " + " ".join(payloads) if payloads else ""))
          p = open(payloads[0], 'rb').read()

          def prelude(art):
              d = open(art, 'rb').read()
              off = d.find(p)
              if off < 0:
                  sys.exit("%s does not contain %s -- the shipped image is not "
                           "the one this build linked" % (art, payloads[0]))
              if d.find(p, off + 1) != -1:
                  sys.exit("%s occurs more than once in %s -- the prelude "
                           "boundary is ambiguous" % (payloads[0], art))
              if off % 1024:
                  sys.exit("-- %s: payload not 1 KB aligned (recovery tools "
                           "round the boundary down to 1 KB and would clip "
                           "code)" % art)
              return off

          off = prelude(recovery)
          print("- %s: prelude [%d/%d bytes]" % (recovery, off, TARGET))
          if off > TARGET:
              sys.exit("-- the recovery image MUST fit the bootrom SRAM "
                       "window; it is %d bytes over. This is the image that "
                       "revives a blank board, so this gate does not ratchet."
                       % (off - TARGET))
          print("-- margin: %d bytes" % (TARGET - off))

          off = prelude(universal)
          print("- %s: prelude [%d/%d bytes]" % (universal, off, TARGET))
          if off > RATCHET:
              sys.exit("-- grew past the %d-byte ratchet by %d bytes; this "
                       "number may only go down" % (RATCHET, off - RATCHET))
          if off > TARGET:
              # Warning, not a failure: this image boots from flash, and the
              # recovery image above covers the UART path. Annotated so the
              # gap stays visible in the checks UI, not just in the log.
              print("::warning title=flashed mini-boot exceeds bootrom SRAM "
                    "window::%s prelude is %d bytes over the %d-byte target, "
                    "so this image cannot itself be uploaded over UART -- use "
                    "the recovery image for that. Tracking: "
                    "OpenIPC/u-boot-hi3516cv200#5" % (universal, off - TARGET, TARGET))
          else:
              print("-- margin: %d bytes" % (TARGET - off))
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.board }}-universal
          path: u-boot-${{ matrix.board }}-universal.bin

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.board }}-recovery
          path: u-boot-${{ matrix.board }}-recovery.bin


  # QEMU smoke test — gates publish on actually-bootable binaries.
  # Boots the freshly-built u-boot in widgetii/qemu-hisilicon's
  # machine model at the default RAM and asserts it prints past the
  # legacy "System startup" banner.
  qemu_smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both binaries target V2-generation Hi3516CV200/Hi3518EV200
        # silicon (ARM926EJ-S); widgetii/qemu-hisilicon's
        # `hi3516cv200` machine emulates that family. There is no
        # standalone `hi3518ev200` machine — the binary boots fine in
        # the cv200 model since they share the SoC.
        include:
          - { board: hi3518ev200, machine: hi3516cv200 }
          - { board: hi3516cv200, machine: hi3516cv200 }
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Resolve qemu-hisilicon HEAD
        id: qemu-rev
        run: |
          sha=$(git ls-remote https://github.com/widgetii/qemu-hisilicon master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache qemu-system-arm
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: qemu-arm
          key: qemu-hisilicon-${{ steps.qemu-rev.outputs.sha }}

      - name: Build qemu-system-arm (cache miss)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master \
            https://github.com/widgetii/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.board }}-universal

      - name: Download recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.board }}-recovery

      # Both variants are booted. The recovery one drops DDR training, so
      # "Uncompress.........Ok" followed by a U-Boot banner is the check that
      # matters there: it means DDR came up from the static reg_info setup
      # alone and the payload decompressed into it.
      - name: Smoke-test in QEMU
        timeout-minutes: 4
        run: |
          chmod +x ./qemu-arm
          rc=0
          for variant in universal recovery; do
            UBOOT="$PWD/u-boot-${{ matrix.board }}-${variant}.bin"
            test -f "$UBOOT"
            rm -f /tmp/uart.in /tmp/uart.out /tmp/uboot.txt
            dd if=/dev/zero of=/tmp/flash.bin bs=1M count=8 2>/dev/null
            dd if="$UBOOT" of=/tmp/flash.bin bs=1 conv=notrunc 2>/dev/null
            mkfifo /tmp/uart.in /tmp/uart.out
            ./qemu-arm \
              -M ${{ matrix.machine }},flash-file=/tmp/flash.bin \
              -nographic -serial pipe:/tmp/uart \
              -monitor none > /tmp/qemu.log 2>&1 &
            QEMU_PID=$!
            timeout 10 cat /tmp/uart.out > /tmp/uboot.txt || true
            kill "$QEMU_PID" 2>/dev/null || true
            wait 2>/dev/null || true
            echo "== $variant: captured u-boot output =="
            cat /tmp/uboot.txt
            echo
            if grep -qE 'U-Boot |Hit any key|CPU:|DRAM:|Board:' /tmp/uboot.txt; then
              echo "PASS: $variant booted past System startup"
            else
              echo "FAIL: $variant did not get past System startup"
              echo
              echo "== qemu stderr =="
              tail -40 /tmp/qemu.log || true
              rc=1
            fi
          done
          exit $rc

  # Publish job — common failure modes:
  #   "GH_TOKEN environment variable required" / empty token: secret
  #     FIRMWARE_RELEASE_TOKEN is missing or unreadable. Set via the
  #     org-level Actions secret on OpenIPC.
  #   401 Bad credentials: PAT expired (fine-grained max is 1 year) or
  #     revoked. Mint a new fine-grained PAT and update the secret.
  #   403 Forbidden: PAT lacks Contents:write on OpenIPC/firmware, or
  #     its repo selector doesn't include OpenIPC/firmware.
  #   404 on `gh release upload latest`: the `latest` tag was deleted in
  #     OpenIPC/firmware. Recreate it before retrying.
  publish:
    needs: [build, qemu_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          # Releases API occasionally returns 502/503 ("Unicorn!"). Retry
          # with linear backoff: 10s, 20s, 30s, 40s — total ~100s.
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          for soc in hi3518ev200 hi3516cv200; do
            for variant in universal recovery; do
              f="artifacts/u-boot-${soc}-${variant}/u-boot-${soc}-${variant}.bin"
              test -f "$f"
              upload "$f"
            done
          done
